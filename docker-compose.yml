services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatevault-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-gatevault-docker-secret-key-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
      - ./backend/backups:/app/backups
    networks:
      - gatevault-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/towers/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: gatevault-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gatevault-net

networks:
  gatevault-net:
    driver: bridge

